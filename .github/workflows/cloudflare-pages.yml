name: Deploy reviewed saved Atlas (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Approved GitHub Release tag containing site.tar.gz
        required: true
        type: string
      bundle_sha256:
        description: Exact approved SHA-256 of site.tar.gz
        required: true
        type: string
      branch:
        description: Cloudflare Pages branch ('main' for production *.pages.dev, or a preview branch name)
        required: false
        default: main
        type: string
      dry_run:
        description: Run SHA-256 and Cloudflare Pages preflight checks without uploading
        required: false
        default: false
        type: boolean
  push:
    branches:
      - feat/cloudflare-pages

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/cloudflare-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'atlas-2j5x-2026-11-19-a11-175-ui008' }}
      REVIEWED_SHA: ${{ inputs.bundle_sha256 || 'a70465a6c497377a94edb1173eafc2ce6129a4587b1d1b76986c34ab0a156717' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CF_BRANCH: ${{ inputs.branch || 'preview-2j5x' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download only the approved static bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern site.tar.gz --dir local

      - name: Verify and unpack the saved export
        run: python scripts/deploy_bundle.py local/site.tar.gz --sha256 "$REVIEWED_SHA" --output site/build

      - name: Deterministic Cloudflare Pages preflight gate
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          project = (os.environ.get("CF_PROJECT") or "").strip()
          branch = (os.environ.get("CF_BRANCH") or "main").strip()
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,56}[a-z0-9])?", project):
              raise SystemExit(f"Invalid or missing CLOUDFLARE_PAGES_PROJECT variable: {project!r}")

          root = Path("site/build").resolve()
          if not (root / "index.html").is_file():
              raise SystemExit("Static site root must contain index.html")

          max_file_bytes = 25 * 1024 * 1024  # Cloudflare Pages 25 MiB limit
          max_file_count = 20_000
          files = {}
          oversized = []
          for p in sorted(root.rglob("*")):
              if ".git" in p.relative_to(root).parts:
                  continue
              if p.is_symlink():
                  raise SystemExit(f"Symlink forbidden in Cloudflare Pages deploy: {p.relative_to(root)}")
              if p.is_dir():
                  continue
              rel = p.relative_to(root).as_posix()
              size = p.stat().st_size
              if size > max_file_bytes:
                  oversized.append((rel, size))
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              files[rel] = (size, sha)

          if oversized:
              details = ", ".join(f"{r} ({s:,} B)" for r, s in oversized[:5])
              raise SystemExit(f"Cloudflare Pages 25 MiB file limit exceeded: {details}")
          if not files or len(files) > max_file_count:
              raise SystemExit(f"Invalid Cloudflare Pages file count: {len(files)}")

          manifest_path = root / "export-manifest.json"
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              declared = {row["path"]: (row["bytes"], row["sha256"]) for row in manifest.get("files", [])}
              actual = {k: v for k, v in files.items() if k != "export-manifest.json"}
              if declared != actual:
                  raise SystemExit("site/build contents differ from export-manifest.json")

          tree_hash = hashlib.sha256()
          for rel, (size, sha) in sorted(files.items()):
              tree_hash.update(f"{rel}\0{size}\0{sha}\n".encode("utf-8"))

          print(json.dumps({
              "preflight": "passed",
              "project": project,
              "branch": branch,
              "file_count": len(files),
              "total_bytes": sum(s for s, _ in files.values()),
              "tree_sha256": tree_hash.hexdigest(),
          }, indent=2))
          PYCODE

      - name: Deploy static site to Cloudflare Pages (Direct Upload)
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret" >&2
            exit 1
          fi
          npm install --no-save wrangler@4
          npx --no-install wrangler pages deploy site/build \
            --project-name "$CF_PROJECT" \
            --branch "$CF_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy reviewed Atlas release ${RELEASE_TAG}" \
            --commit-dirty=false
